# .claude/desk.conf — the desk's per-project config. Commit it: every
# worktree reads the same file. Plain KEY=value lines, parsed and never
# sourced, so no shell expansion happens here. An environment variable of the
# same name overrides a line. Command values run later with `sh -c`.

# The branch every merge lands on.
TRUNK=main

# Prefix of the short-lived item branches, e.g. wt/login-form.
BRANCH_PREFIX=wt/

# Shell glob every slot folder matches. Empty means
# <parent of the main checkout>/<repo name>-wt-[1-9].
SLOT_PATTERN=

# REQUIRED. The command that proves this project works. land.sh runs it on the
# rebased tree and refuses to land without it. Never guess it.
TEST_CMD=

# Optional. Empty means skipped, and land.sh says so in one line.
TYPECHECK_CMD=
BUILD_CMD=

# The ID registry. Empty turns the ID gates off. The default convention is one
# bullet line per item:  - **APP-12** short title
REGISTRY=BACKLOG.md
ID_RE='[A-Z]{2,}-[0-9]+'
DEF_RE='^- \*\*[A-Z]{2,}-[0-9]+\*\*'

# Unlanded item branches allowed at once (review bandwidth, not folders).
WIP_CEILING=3

# 1: land.sh pushes the trunk after landing. 0: pushing stays manual.
PUSH_AFTER_LAND=0
# 1: done.sh pushes the item branch (orphan insurance). Skipped with no origin.
PUSH_ON_DONE=1
